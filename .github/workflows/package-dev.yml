name: Package dev

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: crewweaver-package-dev
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and publish development image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="dev-${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$version" .
          docker push "$image:$version"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)" = "$GITHUB_SHA" ]; then
            docker tag "$image:$version" "$image:latest-dev"
            docker push "$image:latest-dev"
          fi
